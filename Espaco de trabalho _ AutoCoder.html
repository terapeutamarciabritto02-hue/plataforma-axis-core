com vagas e candidatos.","Create a recruitment management admin system, targeting HR professionals and recruiters, primarily for managing job postings, candidate tracking, and interview scheduling. ":"Crie um sistema administrativo de gestão de recrutamento, direcionado a profissionais de RH e recrutadores, principalmente para gerenciar publicações de vagas, acompanhamento de candidatos e agendamento de entrevistas. ","Extra Credits":"Créditos extras","Standard Plan":"Plano Padrão","Task Reward-Adjust component spacing":"Recompensa de tarefa – Ajustar espaçamento dos componentes","Task Reward-Upload and replace image":"Recompensa de tarefa – Enviar e substituir imagem","footer_compare_title":"Comparar","footer_compare_vsBubble":"Autocoder vs Bubble","footer_compare_vsLovable":"Autocoder vs Lovable","footer_compare_vsV0":"Autocoder vs V0","footer_compare_vsReplit":"Autocoder vs Replit","footer_solutions_aiWebBuilder":"Criador de Sites com IA","footer_solutions_crmBuilder":"Criador de CRM Sem Código","footer_solutions_title":"Soluções","preview_homeBadgeText":"Comece grátis, construa com","requirement_tab_app":"App","requirement_tab_backend":"Backend","requirement_tab_website":"Site","requirement_table_page":"Página","requirement_table_requirement":"Componente","seo_home_jsonld_app_description":"Construtor de sites e aplicativos com IA para gerar produtos prontos para produção sem programar.","seo_home_jsonld_app_feature_1":"Geração de aplicativos e sites com IA","seo_home_jsonld_app_feature_2":"Comandos em linguagem natural","seo_home_jsonld_app_feature_3":"Fluxos integrados de interface, backend e banco de dados","seo_home_jsonld_app_feature_4":"Implantação e iteração rápidas","seo_home_jsonld_app_feature_5":"Edição sem código para equipes não técnicas","seo_home_jsonld_faq_q1_answer":"O AutoCoder é um construtor de sites e aplicativos com IA que transforma comandos em linguagem natural em produtos prontos para produção, sem programar.","seo_home_jsonld_faq_q1_question":"O que é o AutoCoder?","seo_home_jsonld_faq_q2_answer":"Descreva o que você quer criar e o AutoCoder gera a interface, as funcionalidades e os fluxos de trabalho do seu produto.","seo_home_jsonld_faq_q2_question":"Como o AutoCoder funciona?","seo_home_jsonld_faq_q3_answer":"Não. O AutoCoder é projetado para que fundadores, operadores e desenvolvedores possam criar aplicativos e sites por meio de fluxos guiados por IA.","seo_home_jsonld_faq_q3_question":"Preciso saber programar para usar o AutoCoder?","seo_home_jsonld_faq_q4_answer":"Você pode criar landing pages, aplicativos web, ferramentas internas, dashboards e outros produtos prontos para produção com a ajuda da IA.","seo_home_jsonld_faq_q4_question":"O que posso criar com o AutoCoder?","seo_home_jsonld_faq_q5_answer":"O AutoCoder oferece planos gratuitos e pagos. Acesse nosso site para ver todas as opções de preços disponíveis.","seo_home_jsonld_faq_q5_question":"O AutoCoder é gratuito?","seo_home_jsonld_faq_q6_answer":"Cadastre-se, descreva o seu produto em linguagem natural e deixe o AutoCoder gerar e refinar a experiência junto com você.","seo_home_jsonld_faq_q6_question":"Como usar o AutoCoder?","seo_home_jsonld_website_description":"Crie sites, aplicativos web, dashboards e ferramentas internas conversando com a IA.","resources_templates_title":"Modelos de Sites e Apps","resources_templates_subtitle":"Explore apps prontos para uso da comunidade AutoCoder e personalize-os do seu jeito.","resources_sparkvibe_title":"SparkVibe","resources_sparkvibe_subtitle":"Explore projetos criativos compartilhados pela comunidade, desperte inspiração e transforme suas ideias em realidade rapidamente.","platform_home_recentProjectsTab":"Projetos recentes","platform_home_templatesTab":"Modelos","赠送积分商品":"Créditos bônus","platform_home_faq_1_a":"Muitos construtores de sites com IA focam principalmente na geração de UI. O AutoCoder é feito para construção de produto mais ampla — estrutura full stack, fluxos de negócio e funcionalidade pronta para lançamento, indo além de páginas simples.","platform_home_faq_1_q":"Como o AutoCoder.cc é diferente de outros construtores de sites com IA?","platform_home_faq_2_a":"Sim. Um bom construtor com IA deve ajudar a ir além do primeiro rascunho. O AutoCoder facilita continuar editando, refinando e expandindo em vez de obrigar a recomeçar após a versão inicial.","platform_home_faq_2_q":"Posso continuar editando e expandindo o projeto no AutoCoder.cc depois que ele for gerado?","platform_home_faq_3_a":"Sim. O AutoCoder pode gerar sites rastreáveis com conteúdo e estrutura reais de página, mais adequados para indexação e crescimento orgânico do que ferramentas só de mockups visuais.","platform_home_faq_3_q":"Sites feitos com o AutoCoder são amigáveis ao SEO e rastreáveis?","platform_home_faq_4_a":"O AutoCoder ajuda a construir mais do que demos de landing: sites reais e apps full stack com a estrutura necessária para lançar, iterar e desenvolver o produto continuamente.","platform_home_faq_4_q":"O que o AutoCoder realmente pode construir: demos, sites ou apps full stack?","platform_home_faq_5_a":"O AutoCoder cobre criação de produto mais completa, incluindo formulários, autenticação, lógica de backend, fluxos relacionados a banco de dados e implementação pronta para produção — onde muitas ferramentas de IA falham após a demo.","platform_home_faq_5_q":"O AutoCoder lida com autenticação, formulários, lógica de banco e implantação?","platform_home_faq_6_a":"Sim. Você pode exportar o código gerado, o que facilita manter a propriedade do projeto, repassar a desenvolvedores e continuar fora da plataforma quando precisar.","platform_home_faq_6_q":"Posso exportar e ser dono do código gerado?","platform_home_faq_intro":"Tudo o que você precisa saber sobre nossa plataforma em um só lugar — explore recursos e entenda as opções de preço.","platform_home_faq_title_line1":"Tem dúvidas? ","platform_home_faq_title_line2":"Temos respostas","template_detail_faq_1_q":"O que é vibe coding?","template_detail_faq_1_a":"Vibe coding é um jeito novo de programar: você descreve em linguagem natural o que quer, e a IA escreve o código. Não precisa dominar sintaxe — precisa expressar ideias com clareza. É a mudança de \"escrever código\" para \"descrever requisitos\", aproximando mais pessoas de criar produtos. Andrej Karpathy popularizou em 2025; hoje é uma abordagem comum.","template_detail_faq_2_q":"Dá mesmo para fazer sem código?","template_detail_faq_2_a":"Com requisitos simples, sim: landing, painel admin ou e-commerce sem uma linha de código. Com lógica complexa, \"sem código\" não quer dizer sem pensamento técnico — você precisa saber o que quer para dar instruções certas. Como com um designer: estilo e recursos, não só \"faz algo bonito\".","template_detail_faq_3_q":"A IA vai substituir programadores?","template_detail_faq_3_a":"Não, mas redefine o papel. A IA faz o trabalho repetitivo; os devs viram \"comandantes de IA\" — definir problema, revisar e decidir. O que muda não é se ainda precisamos de pessoas, mas o que elas fazem. Antes, talvez 80% codar e 20% pensar; no futuro pode inverter.","template_detail_faq_4_q":"Para quem é o AutoCoder?","template_detail_faq_4_a":"Empreendedores — validar ideias sem esperar o time inteiro. PMs — prototipar sozinhos. Designers — implementar sem aprender a programar. Fundadores não técnicos — avançar sem depender tanto de terceiros. Times de dev — protótipos mais rápidos e foco na lógica de negócio.","template_detail_faq_5_q":"Qualidade do código? Serve para produção?","template_detail_faq_5_a":"Frontend com React + Tailwind CSS + shadcn; backend com o motor de servidor próprio da AutoCoder.","template_detail_faq_6_q":"Tem exportação de código?","template_detail_faq_6_a":"Sim, exportação completa. Implante em qualquer servidor, nuvem ou VPS.","template_detail_btn_preview":"Visualizar","template_detail_btn_remix":"Remixar modelo","template_detail_share_label":"Compartilhar","template_detail_capability_1_title":"Geração full-stack via chat","template_detail_capability_1_desc":"Descreva seus requisitos em linguagem natural e o sistema gera automaticamente código completo de frontend, backend e banco de dados — sem precisar programar.","template_detail_capability_2_title":"Modificação conversacional","template_detail_capability_2_desc":"Envie pedidos de alteração por chat em linguagem natural. A IA atualiza o código e a pré-visualização em tempo real. Suporta alterações em lote (várias solicitações de uma vez).","template_detail_capability_3_title":"Backend e banco de dados integrados","template_detail_capability_3_desc":"Gera automaticamente endpoints de API completos, lógica de negócio e operações de banco de dados. Autenticação JWT e controle de acesso baseado em funções integrados. Gerenciamento visual de tabelas — sem escrever SQL.","template_detail_capability_4_title":"Exportação de código completo","template_detail_capability_4_desc":"O código exportado é um projeto padrão completo (inclui backend), sem dependência da plataforma AutoCoder. Pode ser implantado em qualquer servidor.","template_detail_section_about":"Sobre este modelo","template_detail_back":"Voltar aos modelos","template_detail_related_heading":"Modelos relacionados","template_detail_faq_title":"Perguntas frequentes"}}</script>
